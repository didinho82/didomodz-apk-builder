name: Build Personalized APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'Nome que aparece no Android'
        required: true
        type: string
        default: 'Meu App'
      site_url:
        description: 'URL HTTPS que será aberta no app'
        required: true
        type: string
        default: 'https://example.com'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Validar configuração e personalizar app
        env:
          APP_NAME: ${{ inputs.app_name }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          python3 - <<'PY'
          import os, re
          from urllib.parse import urlparse
          name = os.environ['APP_NAME'].strip()
          url = os.environ['SITE_URL'].strip()
          parsed = urlparse(url)
          if not name or len(name) > 40:
              raise SystemExit("Nome inválido: use de 1 a 40 caracteres.")
          if parsed.scheme != "https" or not parsed.netloc:
              raise SystemExit("URL inválida: informe um endereço HTTPS completo.")
          java = "app/src/main/java/com/didomodz/apkbuilder/MainActivity.java"
          with open(java, encoding="utf-8") as f:
              src = f.read()
          src = re.sub(r'private static final String START_URL = ".*?";',
                       'private static final String START_URL = "' + url.replace("\\\\", "\\\\\\\\").replace('"', '\\\\"') + '";',
                       src)
          with open(java, "w", encoding="utf-8") as f:
              f.write(src)
          manifest = "app/src/main/AndroidManifest.xml"
          with open(manifest, encoding="utf-8") as f:
              xml = f.read()
          safe_name = name.replace("&", "&amp;").replace('"', "&quot;").replace("<", "&lt;")
          xml = re.sub(r'android:label="[^"]*"', 'android:label="' + safe_name + '"', xml)
          with open(manifest, "w", encoding="utf-8") as f:
              f.write(xml)
          print("App configurado:", name)
          print("URL:", url)
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: didomodz-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
